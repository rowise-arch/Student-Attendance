<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosk · {{ settings.school_name }} Attendance</title>
  <style>
    :root {
      --bg: #0b1324; --panel: #121c33; --line: #24314f; --text: #f3f6fb; --muted: #a9b5cc;
      --ok: #22c55e; --late: #fbbf24; --out: #60a5fa; --bad: #f87171; --neutral: #94a3b8;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; background: var(--bg);
      color: var(--text); overflow: hidden; display: flex; flex-direction: column; min-height: 100dvh; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 28px 44px 0; }
    .kiosk-status { position: fixed; left: 44px; bottom: 16px; display: flex; gap: 8px; z-index: 5; }
    .kiosk-status .banner { font-size: 15px; padding: 8px 14px; }
    .clock { justify-self: end; }
    .school { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; }
    .logo { width: 44px; height: 44px; border-radius: 11px; background: #1f5eff; display: grid; place-items: center; font-weight: 700; }
    .logo-img { width: 56px; height: 56px; object-fit: contain; background: #fff; padding: 4px; }
    .clock { text-align: right; font-variant-numeric: tabular-nums; }
    .clock .t { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
    .clock .t small { font-size: 20px; font-weight: 600; margin-left: 6px; color: var(--muted); }
    .clock .d { color: var(--muted); font-size: 17px; margin-top: 6px; }

    main { flex: 1; display: grid; place-items: center; position: relative; }
    .stage { position: relative; width: min(920px, 92vw); height: min(440px, 60vh); }
    /* The result card grows out of the tap icon (where the student's attention is) and
       shrinks back into it, so the screen reads as a reaction to the tap. No overshoot. */
    .view { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; border-radius: 28px; transform-origin: 50% 22%;
      transition: opacity 260ms var(--ease-out), transform 340ms var(--ease-out); }
    .view.hidden { opacity: 0; pointer-events: none; transition-duration: 180ms; transition-timing-function: cubic-bezier(.4, 0, 1, 1); }
    .result.hidden { transform: scale(0.82); }
    .idle.hidden { transform: scale(1.04); }

    /* idle */
    .tap-icon { width: 120px; height: 120px; color: #7aa2ff; margin-bottom: 22px; }
    .idle h1 { font-size: 56px; margin: 0; letter-spacing: -0.025em; line-height: 1.05; }
    .idle p { font-size: 22px; color: var(--muted); margin: 12px 0 0; }
    .class-pill { font-size: 22px; font-weight: 600; color: #cfe0ff; background: #16244a; border: 1px solid #2b417a;
      padding: 8px 20px; border-radius: 99px; margin-bottom: 18px; }

    /* result */
    .result { background: var(--panel); border: 2px solid var(--accent, var(--line)); box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 14%, transparent); }
    .avatar { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; font-size: 48px; font-weight: 700;
      background: color-mix(in srgb, var(--accent) 22%, var(--panel)); color: var(--accent); margin-bottom: 22px; position: relative; }
    .avatar svg { width: 64px; height: 64px; }
    .avatar.has-photo { width: 168px; height: 168px; border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 4px var(--accent); }
    .avatar.has-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .result .name { font-size: clamp(36px, 6vw, 64px); font-weight: 700; line-height: 1.08; margin: 0 24px; letter-spacing: -0.022em; }
    .result .line { font-size: 26px; color: var(--muted); margin-top: 12px; }
    .result .line b { color: var(--text); }
    .chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; padding: 8px 20px; border-radius: 99px;
      font-size: 22px; font-weight: 700; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .check { stroke-dasharray: 30; stroke-dashoffset: 30; }
    .result:not(.hidden) .check { animation: draw 320ms 120ms var(--ease-out) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* recent */
    footer { padding: 0 44px 68px; }
    :fullscreen footer { padding-bottom: 28px; }
    .recent-title { color: var(--muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
    .recent { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; min-height: 66px; }
    .r { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; }
    .r b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
    .r span { font-size: 14px; color: var(--muted); }
    .r .k { font-weight: 700; }
    .r .k.in { color: var(--ok); } .r .k.out { color: var(--out); } .r .k.late { color: var(--late); }

    .banner { background: #3b1d1d; color: #fecaca;
      border: 1px solid #7f1d1d; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 16px; }
    .focus-banner { background: #3a2e0b; color: #fde68a; border-color: #854d0e; font: inherit; font-weight: 600; cursor: pointer; }
    .kiosk-controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
    .fs { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--muted); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; opacity: .6; }
    .fs:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; opacity: 1; }
    @media (hover: hover) { .fs:hover { opacity: 1; } }
    :fullscreen .kiosk-controls { display: none; }
    .fs[aria-pressed="true"] { color: var(--text); }
    kbd { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
    @media (max-width: 900px) { .recent { grid-template-columns: repeat(3, minmax(0, 1fr)); } header, footer { padding-left: 20px; padding-right: 20px; } }
    @media (prefers-reduced-motion: reduce) {
      .view, .view.hidden, .result.hidden, .idle.hidden { transform: none; }
      .view { transition: opacity 200ms ease; }
      .result:not(.hidden) .check { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body data-reader-mode="{{ settings.reader_mode }}" data-kiosk="1">
<header>
  <div class="school">{% if settings.school_logo %}<img class="logo logo-img" src="{{ url_for('branding', name=settings.school_logo) }}" alt="">{% else %}<div class="logo" aria-hidden="true">RF</div>{% endif %}{{ settings.school_name }}</div>
  <div class="clock"><div class="t"><span id="time">--:--</span><small id="ampm"></small></div><div class="d" id="date"></div></div>
</header>

<main>
  <div class="stage">
    <section class="view idle" id="idle">
      <svg class="tap-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <rect x="3" y="6" width="13" height="9" rx="1.6"/><circle cx="7" cy="10.5" r="1.6"/><path d="M10.5 9.5h3M10.5 11.5h2"/>
        <path d="M18.5 8.5a5 5 0 0 1 0 7M20.5 6.5a8 8 0 0 1 0 11"/></svg>
      <div class="class-pill" id="class-pill" hidden></div>
      <h1 id="idle-title">Tap your ID card</h1>
      <p id="idle-sub">Hold it flat on the reader until you hear the beep</p>
    </section>
    <section class="view result hidden" id="result" role="status" aria-live="assertive">
      <div class="avatar" id="avatar"></div>
      <div class="name" id="r-name"></div>
      <div class="line" id="r-line"></div>
      <div class="chip" id="r-chip"></div>
    </section>
  </div>
</main>

<footer>
  <div class="recent-title">Recent taps</div>
  <div class="recent" id="recent"></div>
</footer>

<div class="kiosk-status">
  <div class="banner" id="offline" role="alert" hidden>Card reader is offline. Please tell the office.</div>
  <button class="banner focus-banner" id="nofocus" type="button" hidden>Click here so the card reader can type on this screen</button>
</div>
<div class="kiosk-controls">
  <a class="fs" id="back" href="{{ url_for('dashboard') }}" aria-keyshortcuts="Escape"><span aria-hidden="true">←</span> Back to dashboard <kbd aria-hidden="true">Esc</kbd></a>
  <button class="fs" id="sound" type="button" aria-pressed="false">Sound off</button>
  <button class="fs" id="fs" type="button">Full screen</button>
</div>
<script src="{{ url_for('static', filename='scanner.js') }}"></script>
<script src="{{ url_for('static', filename='sounds.js') }}"></script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t12 = hms => { if (!hms) return ""; const [h, m] = hms.split(":"); const H = +h % 12 || 12; return `${H}:${m} ${+h < 12 ? "AM" : "PM"}`; };
const SHOW_MS = 3500;
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="check" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BANG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 6v8M12 18h.01"/></svg>';

let lastId = null, hideTimer = null, queue = [], showing = false;

function describe(s) {
  const name = s.first_name ? `${s.first_name} ${s.last_name}` : null;
  const initials = name ? (s.first_name[0] + s.last_name[0]).toUpperCase() : "";
  const at = `<b>${t12(s.scanned_at.slice(11))}</b>`;
  switch (s.result) {
    case "AM_IN": {
      const late = s.am_status === "LATE";
      return {accent: late ? "var(--late)" : "var(--ok)", avatar: late ? initials : "CHECK",
              name: `Good morning, ${s.first_name}!`, line: `Morning in ${at}`, chip: late ? "Late" : "✓ On time"};
    }
    case "AM_OUT":
      return {accent: "var(--out)", avatar: initials, name: `Enjoy your lunch, ${s.first_name}!`,
              line: `Morning out ${at}`, chip: "Logged out"};
    case "PM_IN": {
      const late = s.pm_status === "LATE";
      return {accent: late ? "var(--late)" : "var(--ok)", avatar: late ? initials : "CHECK",
              name: `Welcome back, ${s.first_name}!`, line: `Afternoon in ${at}`, chip: late ? "Late" : "✓ On time"};
    }
    case "PM_OUT":
      return {accent: "var(--out)", avatar: initials, name: `Goodbye, ${s.first_name}!`,
              line: `Afternoon out ${at} · see you tomorrow`, chip: "Logged out"};
    case "DUP":
      return {accent: "var(--neutral)", avatar: initials, name: name,
              line: "Your tap was already recorded", chip: "No need to tap again"};
    case "DONE":
      return {accent: "var(--neutral)", avatar: initials, name: name,
              line: s.pm_out ? `Already logged out at <b>${t12(s.pm_out)}</b>` : "You already logged in and out this morning",
              chip: "Already logged out"};
    default:
      return {accent: "var(--bad)", avatar: "BANG", name: "Card not registered",
              line: `Please show this card to the office · <span style="font-family:Consolas,monospace">${esc(s.uid)}</span>`, chip: "Not recorded"};
  }
}
function greeting(ts) { const h = +ts.slice(11, 13); return h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"; }

/* Sounds that match the result, so a student knows what happened without looking.
   The preset and any uploaded sound files are chosen in Settings → Kiosk sounds (static/sounds.js).
   On by default for keyboard-type readers (they're silent). ACR122U/Arduino readers beep
   on their own, so it starts off there; the "Sound" button switches it either way. */
let SOUNDS = {{ sounds|tojson }};
KioskSounds.preload(SOUNDS);
function soundKind(s) {
  if (s.result === "AM_IN") return s.am_status === "LATE" ? "late" : "in";
  if (s.result === "PM_IN") return s.pm_status === "LATE" ? "late" : "in";
  if (s.result === "AM_OUT" || s.result === "PM_OUT") return "out";
  if (s.result === "DUP" || s.result === "DONE") return "warn";
  return "error";
}
let soundPref = null;
try { soundPref = localStorage.getItem("kioskSound"); } catch (e) {}
const soundOn = () => soundPref ? soundPref === "on" : KEYBOARD;
function paintSound() { $("sound").textContent = soundOn() ? "Sound on" : "Sound off"; $("sound").setAttribute("aria-pressed", String(soundOn())); }
function unlockAudio() { KioskSounds.unlock(); }
["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, unlockAudio, {capture: true}));
function playTone(kind) { if (soundOn()) KioskSounds.play(SOUNDS, kind); }

function show(scan) {
  const v = describe(scan);
  const el = $("result");
  el.style.setProperty("--accent", v.accent);
  // A student's photo, when there is one, shows instead of initials so the guard can match the face
  $("avatar").innerHTML = scan.photo && scan.result !== "UNKNOWN"
    ? `<img src="/photos/${encodeURIComponent(scan.photo)}" alt="">`
    : v.avatar === "BANG" ? BANG : v.avatar === "CHECK" ? CHECK : esc(v.avatar);
  $("avatar").classList.toggle("has-photo", !!(scan.photo && scan.result !== "UNKNOWN"));
  $("r-name").textContent = v.name;
  $("r-line").innerHTML = v.line;
  $("r-chip").textContent = v.chip;
  // restart the check-draw animation when two taps come back to back
  el.classList.add("hidden"); void el.offsetWidth;
  // picture and sound start on the same frame
  requestAnimationFrame(() => {
    playTone(soundKind(scan));
    $("idle").classList.add("hidden");
    el.classList.remove("hidden");
  });
  showing = true;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(next, queue.length ? 1800 : SHOW_MS);   // move faster when a line is forming
}
function next() {
  if (queue.length) return show(queue.shift());
  showing = false;
  $("result").classList.add("hidden");
  $("idle").classList.remove("hidden");
}

const RECENT = {AM_IN: ["in", "In"], PM_IN: ["in", "In"], AM_OUT: ["out", "Out"], PM_OUT: ["out", "Out"]};
function renderRecent(list) {
  $("recent").innerHTML = list.map(r => {
    let [kind, label] = RECENT[r.result] || ["in", "In"];
    if ((r.result === "AM_IN" && r.am_status === "LATE") || (r.result === "PM_IN" && r.pm_status === "LATE")) [kind, label] = ["late", "Late"];
    return `<div class="r"><b>${esc(r.first_name)} ${esc(r.last_name[0])}.</b><span><span class="k ${kind}">${label}</span> · ${t12(r.scanned_at.slice(11))}</span></div>`;
  }).join("");
}

/* one request at a time: a tap pushed while a poll is running triggers one more poll afterwards */
let inflight = null, again = false;
function poll() {
  if (inflight) { again = true; return inflight; }
  inflight = pollOnce().finally(() => { inflight = null; if (again) { again = false; poll(); } });
  return inflight;
}
async function pollOnce() {
  try {
    const res = await fetch("/api/kiosk" + (lastId !== null ? "?after=" + lastId : ""));
    if (res.status === 401) { location.href = "/login?next=/kiosk"; return; }
    const d = await res.json();
    const P = {before: "Good morning", morning: "Morning log in", lunch: "Lunch break", afternoon: "Afternoon log in", after: "Classes are over"};
    $("class-pill").hidden = false;
    $("class-pill").textContent = P[d.period] || "";
    $("idle-title").textContent = "Tap your ID card";
    $("idle-sub").textContent = "Hold it flat on the reader until you hear the beep";
    KEYBOARD = d.reader_mode === "keyboard" || d.reader_mode === "both";
    paintSound();
    if (d.sounds && JSON.stringify(d.sounds) !== JSON.stringify(SOUNDS)) { SOUNDS = d.sounds; KioskSounds.preload(SOUNDS); }
    $("offline").hidden = KEYBOARD || d.reader === "connected";
    checkFocus();
    if (lastId !== null && d.new.length) {
      queue.push(...d.new);
      if (!showing) next();
      else { clearTimeout(hideTimer); hideTimer = setTimeout(next, 1200); }  // keep the line moving
    }
    lastId = d.last_id;
    renderRecent(d.recent);
  } catch (e) { /* server restarting - keep trying */ }
}
// Keyboard-type reader: it can only type into the window that has focus
let KEYBOARD = ["keyboard", "both"].includes(document.body.dataset.readerMode);
function checkFocus() { $("nofocus").hidden = !KEYBOARD || document.hasFocus(); }
window.addEventListener("focus", checkFocus);
window.addEventListener("blur", checkFocus);
$("nofocus").addEventListener("click", () => { window.focus(); checkFocus(); });
document.addEventListener("rfid-result", () => poll());   // show keyboard taps immediately

/* The clock runs locally (same PC as the server) so it ticks exactly on the second */
function tick() {
  const n = new Date(), h = n.getHours();
  $("time").textContent = `${h % 12 || 12}:${String(n.getMinutes()).padStart(2, "0")}`;
  $("ampm").textContent = h < 12 ? "AM" : "PM";
  $("date").textContent = n.toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric", year: "numeric"});
  setTimeout(tick, 1000 - n.getMilliseconds() + 5);
}
tick();

/* Taps arrive instantly over /api/stream (the server pushes them the moment they're saved,
   together with the reader's beep). Polling stays as a slow safety net. */
let live = false, pollTimer = null;
function schedulePoll() { clearTimeout(pollTimer); pollTimer = setTimeout(() => { poll().finally(schedulePoll); }, live ? 5000 : 700); }
if (window.EventSource) {
  const es = new EventSource("/api/stream");
  es.addEventListener("scan", () => poll());
  es.onopen = () => { live = true; };
  es.onerror = () => { live = false; };
  addEventListener("pagehide", () => es.close());
}
poll().finally(schedulePoll);

$("sound").addEventListener("click", () => {
  soundPref = soundOn() ? "off" : "on";
  try { localStorage.setItem("kioskSound", soundPref); } catch (e) {}
  unlockAudio(); paintSound();
  if (soundOn()) playTone("in");   // a quick sample so you know it works
});
paintSound();
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.fullscreenElement) $("back").click();
});

$("fs").addEventListener("click", () => document.documentElement.requestFullscreen?.());
// The kiosk opens in its own tab: go back to that dashboard tab if it's still open, otherwise open the dashboard here
$("back").addEventListener("click", e => {
  if (window.opener && !window.opener.closed) { e.preventDefault(); window.opener.focus(); window.close(); }
});
</script>
</body>
</html>
